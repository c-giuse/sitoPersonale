<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Il mio sito personale</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column; /* layout in colonna */
      justify-content: flex-start; /* dall'alto */
      align-items: center; /* centrato orizzontalmente */
      background: #121212;
      font-family: Arial, sans-serif;
      padding-top: 40px;
    }

    h1 {
      margin: 0 0 20px 0;
      color: #4da6ff;
      font-size: 2em;
      text-align: center;
    }

    p {
      margin: 0 0 30px 0;
      color: #ccc;
      font-size: 1.1em;
      text-align: center;
    }

    a {
      display: inline-block; /* si adatta al testo */
      margin: 10px 0;
      padding: 12px 20px; /* un po' più di spazio ai lati */
      background: #1e1e1e;
      border-radius: 8px;
      text-decoration: none;
      color: #66ccff;
      font-size: 1.1em;
      transition: background 0.2s ease, color 0.2s ease;
      text-align: center;
    }

    a:hover {
      background: #2c2c2c;
      color: #99ddff;
      /* git add . && git commit -m "Aggiorna layout" && git push origin main */
    }
  </style>
</head>
<body>
  <h1>Benvenuto nel mio sito!</h1>
  <p>Qui troverai i miei appunti in PDF:</p>

  <a href="Appunti Donzella-Guastella.pdf" target="_blank">📄 Appunti Donzella-Guastella</a>
  <a href="Project; BETA.pdf" target="_blank">📄 Project; BETA</a>
  
</body>
</html>
