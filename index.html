<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Il mio sito personale</title>
  <style>
      body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;  /* centratura orizzontale */
      align-items: center;      /* centratura verticale */
      background: #121212;      /* sfondo scuro */
      font-family: Arial, sans-serif;
    }

    .card {
      background: rgba(255, 255, 255, 0.05); /* semi-trasparente */
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.6);
      text-align: center;
      color: #f0f0f0;
      max-width: 400px;
    }

    h1 {
      margin-top: 0;
      color: #4da6ff;
    }

    p {
      margin-bottom: 20px;
      color: #ccc;
    }

    a {
      display: block;
      margin: 10px 0;
      padding: 10px;
      background: #1e1e1e;
      border-radius: 8px;
      text-decoration: none;
      color: #66ccff;
      font-size: 1.1em;
      transition: background 0.2s ease, color 0.2s ease;
    }

    a:hover {
      background: #2c2c2c;
      color: #99ddff;
    }
  </style>
</head>
<body>
  <h1>Benvenuto nel mio sito!</h1>
  <p>Qui troverai i miei appunti in PDF:</p>
  
  <a href="Project; BETA.pdf" target="_blank">📄 Appunti 1</a>
  <a href="Appunti Donzella-Guastella.pdf" target="_blank">📄 Appunti 2</a>
</body>
</html>
